<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Υπολογιστής ΚΕΠ ΑΕΝ</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Υπολογιστής ΚΕΠ ΑΕΝ</h1>

<p>Υπολογισμός Θαλάσσιας Υπηρεσίας</p>

<label>Ημερομηνία Επιβίβασης</label>
<input type="date" id="embark">

<label>Ημερομηνία Απόλυσης</label>
<input type="date" id="discharge">

<label>Βαθμός</label>

<select id="rank">
<option>Γ' Μηχανικός</option>
<option>Β' Μηχανικός</option>
<option>Α' Μηχανικός</option>
<option>Δόκιμος Μηχανικός</option>
</select>

<button id="addTrip">
Προσθήκη Ταξιδιού
</button>

<h2>Ταξίδια</h2>

<div id="tripList">
Δεν υπάρχουν καταχωρημένα ταξίδια.
</div>

<button id="calculate">
Υπολογισμός ΚΕΠ
</button>

<div id="result"></div>

</div>

<script src="app.js"></script>

</body>
</html>
